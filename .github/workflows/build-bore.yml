name: Build linux-cachyos-bore-tsc

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Comprobar nueva versión
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_ver: ${{ steps.check.outputs.upstream_ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Comparar versión upstream con última compilada
        id: check
        run: |
          UPSTREAM=$(curl -s https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-bore/PKGBUILD \
            | grep -E '^(_major|_minor|pkgver|pkgrel)=' | bash -c 'source /dev/stdin; echo "$pkgver-$pkgrel"')
          echo "Upstream: $UPSTREAM"

          LAST=""
          [ -f last_built.txt ] && LAST=$(cat last_built.txt)
          echo "Última compilada: $LAST"

          if [ "$UPSTREAM" != "$LAST" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi
          echo "upstream_ver=$UPSTREAM" >> $GITHUB_OUTPUT

  build:
    name: Compilar en Arch Linux (Docker)
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Compilar kernel dentro de contenedor Arch Linux
        run: |
          cat << 'EOF' > run_build_bore.sh
          #!/bin/bash
          set -e

          # Init pacman keyring to avoid "There is no secret key available to sign with." errors
          pacman-key --init || true
          pacman-key --populate archlinux || true

          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel pacman-contrib git curl bc cpio gettext libelf pahole \
            perl python rust rust-bindgen tar xz zstd xxhash \
            binutils openssl gnupg

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /workspace

          su builder -c "
            gpg --batch --keyserver hkps://keyserver.ubuntu.com \
              --recv-keys E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 \
                          E8B9AA39F054E30E8290D492C3C4820857F654FE || true
          "

          su builder -c "
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/CachyOS/linux-cachyos.git /tmp/cachyos-repo
            cd /tmp/cachyos-repo
            git sparse-checkout set linux-cachyos-bore
          "

          su builder -c "
            cd /tmp/cachyos-repo/linux-cachyos-bore
            cp /workspace/tsc_patches/*.patch .

            sed -i 's/\"config\"/\"config\"\n    \"0001-x86-implement-tsc-directsync-for-systems-without-IA3.patch\"\n    \"0002-x86-touch-clocksource-watchdog-after-syncing-TSCs.patch\"\n    \"0003-x86-save-restore-TSC-counter-value-during-sleep-wake.patch\"\n    \"0004-x86-only-restore-TSC-if-we-have-IA32_TSC_ADJUST-or-d.patch\"\n    \"0005-x86-don-t-check-for-random-warps-if-using-direct-syn.patch\"\n    \"0006-x86-export-tsc_khz-to-userspace.patch\"/g' PKGBUILD

            updpkgsums
            makepkg -sc --noconfirm
          "

          # copy built packages to the mounted workspace
          cp /tmp/cachyos-repo/linux-cachyos-bore/*.pkg.tar.zst /workspace/ || true

          # If HOST_UID/HOST_GID were passed from the runner, chown workspace so
          # the host runner can write files and commit.
          if [ -n "${HOST_UID:-}" ] && [ -n "${HOST_GID:-}" ]; then
            chown -R "${HOST_UID}:${HOST_GID}" /workspace || true
          fi
          EOF
          chmod +x run_build_bore.sh
          
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --privileged \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            archlinux:latest \
            /workspace/run_build_bore.sh

      - name: Listar paquetes generados
        run: ls -lh *.pkg.tar.zst

      - name: Guardar versión compilada
        run: echo "${{ needs.check.outputs.upstream_ver }}" > last_built.txt

      - name: Commit last_built.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_built.txt
          if ! git diff --staged --quiet; then
            git commit -m "ci(bore): built ${{ needs.check.outputs.upstream_ver }}"
            git pull --rebase origin main
            git push
          fi

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.check.outputs.upstream_ver }}"
          TAG="bore-v${VER}"

          git tag "$TAG" || true
          git push origin "$TAG" || true

          gh release create "$TAG" \
            --title "linux-cachyos-bore-tsc ${VER}" \
            --notes "Kernel ${VER} con TSC directsync + BORE scheduler.

          **Instalación:**
          \`\`\`bash
          sudo pacman -U linux-cachyos-bore-*.pkg.tar.zst linux-cachyos-bore-headers-*.pkg.tar.zst
          \`\`\`
          Asegúrate de tener \`tsc=directsync\` en tus parámetros de kernel." \
            *.pkg.tar.zst \
          || gh release upload "$TAG" *.pkg.tar.zst --clobber
