name: Build linux-cachyos-tsc

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Comprobar nueva versión
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_ver: ${{ steps.check.outputs.upstream_ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Comparar versión upstream con última compilada
        id: check
        run: |
          UPSTREAM=$(curl -s https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/PKGBUILD \
            | awk -F'=' '/^pkgver=/{ver=$2} /^pkgrel=/{rel=$2} END{print ver "-" rel}')
          echo "Upstream: $UPSTREAM"

          LAST=""
          [ -f last_built_default.txt ] && LAST=$(cat last_built_default.txt)
          echo "Última compilada: $LAST"

          if [ "$UPSTREAM" != "$LAST" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi
          echo "upstream_ver=$UPSTREAM" >> $GITHUB_OUTPUT

  build:
    name: Compilar en Arch Linux (Docker)
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Compilar kernel dentro de contenedor Arch Linux
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/bash
          set -e

          # Init pacman keyring (avoid "no secret key" errors)
          pacman-key --init || true
          pacman-key --populate archlinux || true

          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel pacman-contrib git curl bc cpio gettext libelf pahole \
            perl python rust rust-bindgen tar xz zstd xxhash \
            binutils openssl gnupg

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /workspace

          su builder -c "
            gpg --batch --keyserver hkps://keyserver.ubuntu.com \
              --recv-keys E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 \
                          E8B9AA39F054E30E8290D492C3C4820857F654FE || true
          "

          su builder -c "
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/CachyOS/linux-cachyos.git /tmp/cachyos-repo
            cd /tmp/cachyos-repo
            git sparse-checkout set linux-cachyos
          "

          su builder -c "
            cd /tmp/cachyos-repo/linux-cachyos
            cp /workspace/tsc_patches/*.patch .

            # Inyectar patches tal y como está en el script sh
            sed -i 's/\"config\"/\"config\"\n    \"0001-x86-implement-tsc-directsync-for-systems-without-IA3.patch\"\n    \"0002-x86-touch-clocksource-watchdog-after-syncing-TSCs.patch\"\n    \"00[...]/
            updpkgsums
            makepkg -sc --noconfirm
          "

          # copy built packages to the mounted workspace
          cp /tmp/cachyos-repo/linux-cachyos/*.pkg.tar.zst /workspace/ || true

          # If HOST_UID/HOST_GID were passed from the runner, chown workspace so
          # the host runner can write files and commit.
          if [ -n "${HOST_UID:-}" ] && [ -n "${HOST_GID:-}" ]; then
            chown -R "${HOST_UID}:${HOST_GID}" /workspace || true
          fi

          EOF
          chmod +x run_build.sh
          
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --privileged \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            archlinux:latest \
            /workspace/run_build.sh

      - name: Listar paquetes generados
        run: ls -lh *.pkg.tar.zst

      - name: Guardar versión compilada
        run: echo "${{ needs.check.outputs.upstream_ver }}" > last_built_default.txt

      - name: Commit last_built_default.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_built_default.txt
          git diff --staged --quiet || git commit -m "ci(default): built ${{ needs.check.outputs.upstream_ver }}"
          git push

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.check.outputs.upstream_ver }}"
          TAG="default-v${VER}"

          git tag "$TAG" || true
          git push origin "$TAG" || true

          gh release create "$TAG" \
            --title "linux-cachyos-tsc ${VER}" \
            --notes "Kernel ${VER} con TSC directsync (EEVDF).

          **Instalación:**
          \`\`\`bash
          sudo pacman -U linux-cachyos-*.pkg.tar.zst linux-cachyos-headers-*.pkg.tar.zst
          \`\`\`
          Asegúrate de tener \`tsc=directsync\` en tus parámetros de kernel." \
            *.pkg.tar.zst \
          || gh release upload "$TAG" *.pkg.tar.zst --clobber
