name: Build linux-cachyos-tsc

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Comprobar nueva versión
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_ver: ${{ steps.check.outputs.upstream_ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Comparar versión upstream con última compilada
        id: check
        run: |
          UPSTREAM=$(curl -s https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/PKGBUILD \
            | awk -F'=' '/^pkgver=/{ver=$2} /^pkgrel=/{rel=$2} END{print ver "-" rel}')
          echo "Upstream: $UPSTREAM"

          LAST=""
          [ -f last_built_default.txt ] && LAST=$(cat last_built_default.txt)
          echo "Última compilada: $LAST"

          if [ "$UPSTREAM" != "$LAST" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi
          echo "upstream_ver=$UPSTREAM" >> $GITHUB_OUTPUT

  build:
    name: Compilar en Arch Linux (Docker)
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Compilar kernel dentro de contenedor Arch Linux
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --privileged \
            archlinux:latest \
            bash -c '
              set -e

              pacman -Syu --noconfirm
              pacman -S --noconfirm \
                base-devel pacman-contrib git curl bc cpio gettext libelf pahole \
                perl python rust rust-bindgen tar xz zstd xxhash \
                binutils openssl

              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /workspace

              su builder -c "
                gpg --batch --keyserver hkps://keyserver.ubuntu.com \
                  --recv-keys E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 \
                              E8B9AA39F054E30E8290D492C3C4820857F654FE || true
              "

              su builder -c "
                git clone --depth 1 --filter=blob:none --sparse \
                  https://github.com/CachyOS/linux-cachyos.git /tmp/cachyos-repo
                cd /tmp/cachyos-repo
                git sparse-checkout set linux-cachyos
              "

              su builder -c "
                cd /tmp/cachyos-repo/linux-cachyos
                cp /workspace/tsc_patches/*.patch .

                # Inyectar patches en source=() usando python para evitar
                # que sed rompa otras ocurrencias de \"config\" en el PKGBUILD
                python3 << PYEOF
import re

with open(\"PKGBUILD\", \"r\") as f:
    content = f.read()

patches = \"\"\"  \\\"0001-x86-implement-tsc-directsync-for-systems-without-IA3.patch\\\"
  \\\"0002-x86-touch-clocksource-watchdog-after-syncing-TSCs.patch\\\"
  \\\"0003-x86-save-restore-TSC-counter-value-during-sleep-wake.patch\\\"
  \\\"0004-x86-only-restore-TSC-if-we-have-IA32_TSC_ADJUST-or-d.patch\\\"
  \\\"0005-x86-don-t-check-for-random-warps-if-using-direct-syn.patch\\\"
  \\\"0006-x86-export-tsc_khz-to-userspace.patch\\\"\"\"\"

# Solo reemplaza dentro del bloque source=(...), buscando la línea exacta con \"config\"
content = re.sub(
    r'(source=\(.*?)(\"config\")(.*?\))',
    lambda m: m.group(1) + m.group(2) + \"\n\" + patches + m.group(3),
    content,
    count=1,
    flags=re.DOTALL
)

with open(\"PKGBUILD\", \"w\") as f:
    f.write(content)

print(\"Patches inyectados correctamente\")
PYEOF

                updpkgsums
                makepkg -sc --noconfirm
              "

              cp /tmp/cachyos-repo/linux-cachyos/*.pkg.tar.zst /workspace/
            '

      - name: Listar paquetes generados
        run: ls -lh *.pkg.tar.zst

      - name: Guardar versión compilada
        run: echo "${{ needs.check.outputs.upstream_ver }}" > last_built_default.txt

      - name: Commit last_built_default.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_built_default.txt
          git diff --staged --quiet || git commit -m "ci(default): built ${{ needs.check.outputs.upstream_ver }}"
          git push

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.check.outputs.upstream_ver }}"
          TAG="default-v${VER}"

          git tag "$TAG" || true
          git push origin "$TAG" || true

          gh release create "$TAG" \
            --title "linux-cachyos-tsc ${VER}" \
            --notes "Kernel ${VER} con TSC directsync (EEVDF).

          **Instalación:**
          \`\`\`bash
          sudo pacman -U linux-cachyos-*.pkg.tar.zst linux-cachyos-headers-*.pkg.tar.zst
          \`\`\`
          Asegúrate de tener \`tsc=directsync\` en tus parámetros de kernel." \
            *.pkg.tar.zst \
          || gh release upload "$TAG" *.pkg.tar.zst --clobber
